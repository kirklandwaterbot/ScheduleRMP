name: Firefox extension CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn test
      - run: yarn lint:firefox
      - run: yarn package:firefox
      - uses: actions/upload-artifact@v7
        with:
          name: rmp-schedule-builder-firefox
          path: artifacts/*.zip
